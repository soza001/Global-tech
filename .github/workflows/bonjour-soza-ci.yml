name: Bonjour Soza CI

on:
  push:
    branches:
      - feature/bonjour-soza-chat
  pull_request:
    branches:
      - main
      - feature/bonjour-soza-chat

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Build production app
        run: npm run build
